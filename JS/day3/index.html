
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEEL CRYPTO TRACKER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>STEEL CRYPTO</h1>
            <p>REAL-TIME MARKET TRACKER</p>
        </header>

        <section class="market-info">
            <h2>암호화폐 실시간 시세</h2>
            <p>BINANCE · USDT MARKET</p>
            <div id="update-time">데이터 연결 대기 중...</div>
        </section>

        <section class="search-section">
            <input
                type="text"
                id="search-input"
                placeholder="코인 이름 또는 심볼 검색"
            >
        </section>

        <section class="tab-section">
            <button id="all-tab" class="tab active">전체보기</button>
            <button id="favorite-tab" class="tab">관심항목</button>
        </section>

        <section class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>관심</th>
                        <th>코인</th>
                        <th>현재 가격 (USDT)</th>
                        <th>24시간 변동률</th>
                    </tr>
                </thead>
                <tbody id="coin-list">
                    <tr>
                        <td colspan="4">데이터를 불러오는 중입니다.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
